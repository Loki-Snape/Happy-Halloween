<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharaoh's Code Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quicksand:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --royal-gold: #d4af37;
      --sandstone: #e3c4a8;
      --pyramid-shadow: #8b5e34;
      --lapis-blue: #003366;
      --nile-teal: #008080;
      --scarab-green: #2e5a1c;
      --papyrus-white: #f2e8c4;
      --tomb-dark: #1a1a1a;
    }

    body {
      background-color: var(--tomb-dark);
      /* Hieroglyphic-style pattern */
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l15 30H15L30 0zM0 30l15 30H0V30zm60 0L45 60h15V30z' fill='%3C3d2b1f' fill-opacity='0.2'/%3E%3C/svg%3E");
      color: var(--papyrus-white);
      font-family: 'Quicksand', sans-serif;
      margin: 0;
      padding: 40px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      max-width: 400px;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border: 5px solid var(--royal-gold);
      border-radius: 50% 50% 10% 10%; /* Sarcophagus-inspired shape */
      object-fit: cover;
      box-shadow: 0px 0px 20px rgba(212, 175, 55, 0.4);
      background-color: #333;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 3rem;
      margin: 15px 0 5px;
      letter-spacing: 2px;
      color: var(--royal-gold);
      text-shadow: 3px 3px 0px #000;
    }

    .description {
      font-size: 1.1rem;
      line-height: 1.4;
      opacity: 0.9;
      color: var(--sandstone);
    }

    .links-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      max-width: 420px;
      width: 100%;
    }

    .link-card {
      text-decoration: none;
      width: calc(50% - 10px);
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: all 0.3s ease;
      border: 2px solid var(--royal-gold);
      box-sizing: border-box;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .link-card span {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .pyramid {
      background: linear-gradient(145deg, var(--pyramid-shadow), #5d4037);
      color: var(--papyrus-white);
      box-shadow: 0 6px 0px #3e2723;
    }

    .nile {
      background: linear-gradient(145deg, var(--lapis-blue), #001a33);
      color: var(--royal-gold);
      box-shadow: 0 6px 0px #000a1a;
    }

    .scarab {
      background: linear-gradient(145deg, #2e5a1c, #1b3311);
      color: var(--papyrus-white);
      box-shadow: 0 6px 0px #0d1a08;
    }

    .link-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.6);
      filter: brightness(1.1);
    }

    footer {
      margin-top: 50px;
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--royal-gold);
      letter-spacing: 4px;
    }
  </style>
</head>
<body>

  <header>
    <img src="Om PFP.png" alt="Profile" class="profile-pic">
    <h1>Mridul Jha</h1>
    <p class="description">High Priest of the MERN Crypt.<br>Awakening powerful scripts & Resurrecting programs that lasts for an eternity.</p>
  </header>

  <div class="links-grid">
    <a href="https://www.linkedin.com/in/mridul-jha/" class="link-card pyramid">
      <div class="icon">🔱</div>
      <span>LinkedIn</span>
    </a>
    <a href="https://github.com/Loki-Snape/" class="link-card pyramid">
      <div class="icon">📜</div>
      <span>GitHub</span>
    </a>
    <a href="Resume.html" class="link-card nile">
      <div class="icon">☥</div>
      <span>Resume</span>
    </a>
    <a href="index.html" class="link-card nile">
      <div class="icon">🏺</div>
      <span>Portfolio</span>
    </a>
    <a href="https://codolio.com/profile/Loki-Snape" class="link-card scarab">
      <div class="icon">𓆣</div>
      <span>Codeolio</span>
    </a>
    <a href="mailto:himriduljha11@gmail.com" class="link-card scarab">
      <div class="icon">✉️</div>
      <span>Mail</span>
    </a>
  </div>

  <footer>Awaken Anck-Su-Na-MERN</footer>

</body>
</html>
